[build-system]
requires = ["setuptools>=70.0.0", "wheel>=0.41.2"]
build-backend = "setuptools.build_meta"

[project]
name = "authproxy"
version = "0.1.0"
description = "Authentication proxy for RDF4J triplestore"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "FAU CDI" },
]

dependencies = [
    "Django>=5.0.10",
    "djangorestframework>=3.15.2",
    "requests>=2.32.0",
    "urllib3>=2.2.2",
]

[project.optional-dependencies]
prod = [
    "uwsgi>=2.0.26",
]
dev = [
    "pytest>=8.2.0",
    "black>=24.4.1",
    "pylint>=3.1.0",
    "isort>=5.13.2",
]

[tool.setuptools.packages.find]
include = ["authproxy*", "rdf4j*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "authproxy.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["rdf4j"]

[tool.pylint.master]
py-version = "3.12"
output-format = "colorized"

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "pk", "id"]

[tool.pyright]
typeCheckingMode = "basic"
