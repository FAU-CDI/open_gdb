services:
  rdf4j:
    image: eclipse/rdf4j-workbench
    restart: always
    environment:
      - JAVA_OPTS=-Xms1g -Xmx4g -Dhttp.nonProxyHosts="" -Dhttp.proxyHost=outproxy -Dhttp.proxyPort=8080 -Dhttps.proxyHost=outproxy -Dhttps.proxyPort=8080
    volumes:
      - rdf4j-data:/var/rdf4j
      - rdf4j-logs:/usr/local/tomcat/logs

  graphdb-workbench:
    build:
      context: .
      dockerfile: graphdb-workbench/workbench.Dockerfile
    environment:
      GRAPHDB_URL: http://localhost
      WORKBENCH_PORT: ${WORKBENCH_PORT}
    depends_on:
      - graphdb
    ports:
      - ${WORKBENCH_PORT}
    networks:
      - single-spa-network
    healthcheck:
      test: ["CMD-SHELL", "apk add --no-cache curl && curl -f -H 'Accept: */*' http://workbench:${WORKBENCH_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginxinc/nginx-unprivileged:latest
    restart: always
    environment:
      AUTHPROXY_HOSTNAME: authproxy
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    depends_on:
      - rdf4j
      - authproxy
      - outproxy
    ports:
      - ${PUBLIC_PORT}:80
    volumes:
        - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template
        - ./graphdb-workbench/dist:/usr/share/nginx/html

  outproxy:
    image: ghcr.io/fau-cdi/open_gdb_outproxy:latest
    build:
      context: outproxy
    restart: always
    depends_on:
      - rdf4j

  authproxy:
    image: ghcr.io/fau-cdi/open_gdb_authproxy:latest
    build:
      context: authproxy
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_SUPERUSER_NAME: ${DJANGO_SUPERUSER_NAME}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      RDF4J_HOSTNAME: rdf4j
      RDF4J_TIMEOUT: ${RDF4J_TIMEOUT:-5}
    depends_on:
      - rdf4j
    volumes:
      - authproxy-data:/data/
    ports:
      - 3000:8000

volumes:
  rdf4j-data:
  rdf4j-logs:
  authproxy-data:
